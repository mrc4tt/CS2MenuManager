name: Build and Publish

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/README.md'
      - '**/.gitignore'
      - '**/LICENSE'

# Publishes CS2MenuManager to git.miksen.me two ways:
#   1. NuGet package  -> Forgejo package registry (compile-time dep for
#      CS2-SimpleAdmin / MatchZy / WeaponPaints via PackageReference).
#   2. Runtime plugin -> Forgejo release zip (drop-in addons/counterstrikesharp
#      tree; CS2-SimpleAdmin bundles the latest release).
#
# Version is derived from ProjectInfo.cs (`Version = "vNN"` -> 1.0.NN) so it
# tracks the same scheme schwarper publishes on nuget.org. The job is
# idempotent: nuget push --skip-duplicate and the release step skips an
# already-existing tag, so re-runs on the same version are no-ops.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y zip jq curl

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          # ProjectInfo.cs holds e.g. `public const string Version = "v42";`
          RAW=$(grep -oP 'Version\s*=\s*"v\K[0-9]+' CS2MenuManager/ProjectInfo.cs | head -1)
          if [ -z "$RAW" ]; then
            echo "Error: could not parse version from CS2MenuManager/ProjectInfo.cs"
            exit 1
          fi
          VER="1.0.${RAW}"
          echo "Version: $VER"
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"

      - name: Build solution
        # Both projects carry explicit OutputPath (..\BuildOutput\{plugins,shared}\),
        # so no -o here; that keeps the CSS drop-in layout intact.
        run: dotnet build CS2MenuManager.sln -c Release

      - name: Pack NuGet package
        # --no-build: the csproj uses a custom OutputPath; letting pack rebuild
        # trips NU5026 (packs before build lands the dll). Pack the artifacts the
        # previous build step already produced.
        run: |
          dotnet pack CS2MenuManager/CS2MenuManager.csproj -c Release --no-build \
            -p:PackageVersion=${{ steps.version.outputs.VERSION }} \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            -o nupkgs

      - name: Debug auth
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN2 || secrets.GITHUB_TOKEN }}
          HAS_RELEASE_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN2 != '' }}
        run: |
          set -euo pipefail
          echo "RELEASE_TOKEN secret set? $HAS_RELEASE_TOKEN"
          echo "token length: ${#NUGET_TOKEN}"
          echo "owner: ${{ github.repository_owner }}"
          echo "server: ${GITHUB_SERVER_URL}"
          # Who does this token authenticate as? (valid token -> 200 + login)
          echo "--- /api/v1/user ---"
          curl -s -w '\nHTTP %{http_code}\n' \
            -H "Authorization: token ${NUGET_TOKEN}" \
            "${GITHUB_SERVER_URL}/api/v1/user" | sed -n '1,3p'

      - name: Push NuGet package to Forgejo registry
        env:
          # Must be a PAT with `write:package` scope. The auto Actions token
          # (GITHUB_TOKEN) usually lacks package-write -> 401 Unauthorized.
          NUGET_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN2 || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # dotnet nuget push mis-handles Forgejo auth (sends api-key header,
          # gets 401). Upload directly with a basic-auth PUT instead — same
          # auth path as the release step below.
          UPLOAD="${GITHUB_SERVER_URL}/api/packages/${{ github.repository_owner }}/nuget"
          for pkg in nupkgs/*.nupkg; do
            echo "Uploading $pkg to $UPLOAD"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X PUT \
              --user "${{ github.repository_owner }}:${NUGET_TOKEN}" \
              --upload-file "$pkg" \
              "$UPLOAD")
            # 201 = created, 409 = already exists (idempotent re-run) -> both OK
            if [ "$STATUS" != "201" ] && [ "$STATUS" != "409" ]; then
              echo "Error: upload failed with HTTP $STATUS"
              exit 1
            fi
            echo "OK ($STATUS)"
          done

      - name: Assemble runtime plugin tree
        run: |
          set -euo pipefail
          mkdir -p pkg/addons/counterstrikesharp
          # csproj OutputPath ($(ProjectDir)..\BuildOutput\...) lands at the repo
          # root, not under the project folder.
          cp -r BuildOutput/plugins pkg/addons/counterstrikesharp/
          cp -r BuildOutput/shared   pkg/addons/counterstrikesharp/
          # GeneratePackageOnBuild drops a stray .nupkg into shared/; keep it out
          # of the runtime zip.
          find pkg -name '*.nupkg' -delete
          echo ">> Runtime tree:"
          find pkg -type f | sort

      - name: Create release zip
        run: |
          cd pkg && zip -r "../CS2MenuManager-${{ steps.version.outputs.VERSION }}.zip" addons && cd ..

      - name: Create Forgejo release (skip if tag exists)
        if: github.event_name != 'pull_request'
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_RELEASE_TOKEN2 || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          TAG="${{ steps.version.outputs.VERSION }}"
          ZIP="CS2MenuManager-${TAG}.zip"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            "${API}/releases/tags/${TAG}")
          if [ "$STATUS" = "200" ]; then
            echo "Release ${TAG} already exists. Skipping."
            exit 0
          fi

          RELEASE_RESPONSE=$(curl -s -X POST "${API}/releases" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg tag "$TAG" --arg name "CS2MenuManager $TAG" \
              --arg body "Auto-built from VPS runner. NuGet package published to the Forgejo registry; this zip is the runtime plugin (extract into game/csgo/)." \
              --arg target "${GITHUB_SHA}" \
              '{tag_name:$tag, name:$name, body:$body, target_commitish:$target, draft:false, prerelease:false}')")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            echo "Error: failed to create release"
            echo "$RELEASE_RESPONSE"
            exit 1
          fi
          echo "Created release ID $RELEASE_ID"

          curl -s -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -F "attachment=@${ZIP}" \
            "${API}/releases/${RELEASE_ID}/assets?name=${ZIP}"
